<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1628"/>
      <stop offset="100%" stop-color="#050B14"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#D95000"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4AA"/>
      <stop offset="100%" stop-color="#009677"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF6B00"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00D4AA"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="url(#bgGrad)"/>

  <!-- Title & Header -->
  <text x="50" y="50" font-family="'Inter', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">SatQuery AI — System Architecture</text>
  <text x="50" y="75" font-family="'Inter', sans-serif" font-size="14" fill="#94A3B8">SIH26167 | ISRO Space Applications Centre | Agentic Multi-Modal Architecture</text>

  <!-- USER NODE -->
  <rect x="50" y="270" width="130" height="90" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <circle cx="115" cy="305" r="16" fill="#38BDF8"/>
  <text x="115" y="340" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Field Officer</text>
  <text x="115" y="354" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Disaster / Agri / Forest</text>

  <!-- WEB UI -->
  <rect x="230" y="250" width="160" height="130" rx="10" fill="#0F172A" stroke="#00D4AA" stroke-width="2"/>
  <rect x="230" y="250" width="160" height="28" rx="10" fill="#1E293B"/>
  <text x="310" y="269" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#00D4AA" text-anchor="middle">SatQuery Web UI</text>
  <text x="310" y="305" font-family="'Inter', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">Drag-Drop Upload</text>
  <text x="310" y="325" font-family="'Inter', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">Natural Language Prompt</text>
  <text x="310" y="345" font-family="'Inter', sans-serif" font-size="11" fill="#38BDF8" text-anchor="middle">Leaflet Map Overlay</text>

  <!-- FASTAPI BACKEND -->
  <rect x="440" y="240" width="160" height="150" rx="12" fill="#0F172A" stroke="#FF6B00" stroke-width="2"/>
  <rect x="440" y="240" width="160" height="32" rx="12" fill="url(#orangeGrad)"/>
  <text x="520" y="262" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">FastAPI Gateway</text>
  <text x="520" y="295" font-family="'Inter', sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">Async REST Engine</text>
  <text x="520" y="315" font-family="'Inter', sans-serif" font-size="11" fill="#CBD5E1" text-anchor="middle">Pydantic v2 Schemas</text>
  <text x="520" y="335" font-family="'Inter', sans-serif" font-size="11" fill="#CBD5E1" text-anchor="middle">OpenAPI / Swagger</text>
  <text x="520" y="355" font-family="'Inter', sans-serif" font-size="11" fill="#00D4AA" text-anchor="middle">Fail-safe DEMO_MODE</text>

  <!-- QUERY ROUTER -->
  <polygon points="660,255 740,315 660,375 580,315" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <text x="660" y="312" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#38BDF8" text-anchor="middle">ReAct Router</text>
  <text x="660" y="326" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Embedding + Ont</text>

  <!-- 4 PARALLEL TOOL MODULES -->
  <!-- Tool 1: Change Detector -->
  <rect x="760" y="110" width="200" height="85" rx="8" fill="#1E293B" stroke="#FF6B00" stroke-width="1.5"/>
  <text x="860" y="135" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#FF6B00" text-anchor="middle">12-Stage Change Engine</text>
  <text x="860" y="153" font-family="'Inter', sans-serif" font-size="10" fill="#CBD5E1" text-anchor="middle">STSF-Net Pseudo Suppression</text>
  <text x="860" y="169" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Otsu &bull; Bimodal Metric (ω, v, p)</text>

  <!-- Tool 2: Spectral Engine -->
  <rect x="760" y="215" width="200" height="85" rx="8" fill="#1E293B" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="860" y="240" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#00D4AA" text-anchor="middle">Spectral Indices Engine</text>
  <text x="860" y="258" font-family="'Inter', sans-serif" font-size="10" fill="#CBD5E1" text-anchor="middle">NDVI, NDWI, NDBI, EVI, RVI</text>
  <text x="860" y="274" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Physical Interpretation Logic</text>

  <!-- Tool 3: SAM Segmentor -->
  <rect x="760" y="320" width="200" height="85" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="860" y="345" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#38BDF8" text-anchor="middle">SAM Segmentor</text>
  <text x="860" y="363" font-family="'Inter', sans-serif" font-size="10" fill="#CBD5E1" text-anchor="middle">Promptable Land-Cover Masks</text>
  <text x="860" y="379" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Water &bull; Forest &bull; Urban Polygons</text>

  <!-- Tool 4: Object Detector -->
  <rect x="760" y="425" width="200" height="85" rx="8" fill="#1E293B" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="860" y="450" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#FBBF24" text-anchor="middle">DOTA Object Counter</text>
  <text x="860" y="468" font-family="'Inter', sans-serif" font-size="10" fill="#CBD5E1" text-anchor="middle">Oriented Bounding Boxes</text>
  <text x="860" y="484" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Maritime Ships &bull; Tanks &bull; Vehicles</text>

  <!-- SENSOR CALIBRATION MODULE -->
  <rect x="440" y="450" width="160" height="110" rx="10" fill="#1E202A" stroke="#FF6B00" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="520" y="475" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#FF6B00" text-anchor="middle">ISRO Sensor Calibrator</text>
  <text x="520" y="495" font-family="'Inter', sans-serif" font-size="10" fill="#CBD5E1" text-anchor="middle">Cartosat-2S / 3 (PAN+MS)</text>
  <text x="520" y="512" font-family="'Inter', sans-serif" font-size="10" fill="#CBD5E1" text-anchor="middle">RISAT-1C (C-band SAR)</text>
  <text x="520" y="529" font-family="'Inter', sans-serif" font-size="10" fill="#CBD5E1" text-anchor="middle">ResourceSat-2A (AWiFS)</text>
  <text x="520" y="546" font-family="'Inter', sans-serif" font-size="10" fill="#38BDF8" text-anchor="middle">EOS-05 (Hyperspectral)</text>

  <!-- VLM ENGINE & REPORT GENERATOR -->
  <rect x="440" y="90" width="160" height="100" rx="10" fill="#1E293B" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="520" y="115" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#00D4AA" text-anchor="middle">VLM Engine</text>
  <text x="520" y="135" font-family="'Inter', sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle">GeoChat-7B (4-bit QLoRA)</text>
  <text x="520" y="152" font-family="'Inter', sans-serif" font-size="10" fill="#CBD5E1" text-anchor="middle">Sensor-Conditioned Prompt</text>
  <text x="520" y="169" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Chain-of-Thought Reasoning</text>

  <!-- OUTPUT NODES -->
  <rect x="180" y="570" width="260" height="80" rx="10" fill="#0F172A" stroke="#00D4AA" stroke-width="2"/>
  <text x="310" y="600" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#00D4AA" text-anchor="middle">ISRO Bhuvan / VEDAS GeoJSON</text>
  <text x="310" y="620" font-family="'Inter', sans-serif" font-size="10" fill="#E2E8F0" text-anchor="middle">Standard WGS84 EPSG:4326 Vectors</text>
  <text x="310" y="635" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Direct Import into Disaster Control Rooms</text>

  <rect x="480" y="570" width="260" height="80" rx="10" fill="#0F172A" stroke="#FF6B00" stroke-width="2"/>
  <text x="610" y="600" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#FF6B00" text-anchor="middle">Operational Disaster Report</text>
  <text x="610" y="620" font-family="'Inter', sans-serif" font-size="10" fill="#E2E8F0" text-anchor="middle">Quantitative Area Metrics &bull; Actions</text>
  <text x="610" y="635" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Full 12-Stage Verifiable Audit Trace</text>

  <!-- ARROWS & CONNECTORS -->
  <line x1="180" y1="315" x2="230" y2="315" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="390" y1="315" x2="440" y2="315" stroke="#FF6B00" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <line x1="600" y1="315" x2="660" y2="315" stroke="#38BDF8" stroke-width="2"/>
  <line x1="520" y1="390" x2="520" y2="450" stroke="#FF6B00" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Router to Tools -->
  <path d="M 740 315 L 750 315 L 750 152 L 760 152" fill="none" stroke="#FF6B00" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <path d="M 740 315 L 750 315 L 750 257 L 760 257" fill="none" stroke="#00D4AA" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <path d="M 740 315 L 760 362" fill="none" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <path d="M 740 315 L 750 315 L 750 467 L 760 467" fill="none" stroke="#FBBF24" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

  <!-- Tools to VLM Engine & Synthesis -->
  <path d="M 860 110 L 860 70 L 600 70 L 580 90" fill="none" stroke="#00D4AA" stroke-width="1.5"/>
  <path d="M 520 190 L 520 240" fill="none" stroke="#00D4AA" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Backend to Outputs -->
  <path d="M 460 390 L 460 540 L 310 540 L 310 570" fill="none" stroke="#00D4AA" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 580 390 L 580 540 L 610 540 L 610 570" fill="none" stroke="#FF6B00" stroke-width="2" marker-end="url(#arrowOrange)"/>
</svg>
