    <linearGradient id="agriGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0C0"/>
      <stop offset="100%" stop-color="#00A884"/>
    </linearGradient>
    <linearGradient id="defenseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C33"/>
      <stop offset="100%" stop-color="#E05D00"/>
