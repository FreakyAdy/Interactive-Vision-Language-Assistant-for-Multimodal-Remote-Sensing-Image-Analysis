<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="bgU" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1628"/>
      <stop offset="100%" stop-color="#040914"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="650" fill="url(#bgU)"/>

  <!-- Top Navbar -->
  <rect x="0" y="0" width="1000" height="60" fill="#0E1E38" stroke="#1E293B" stroke-width="1"/>
  <circle cx="45" cy="30" r="14" fill="#FF6B00"/>
  <text x="70" y="36" font-family="'Inter', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">SatQuery <tspan fill="#FF6B00">AI</tspan></text>
  <text x="210" y="35" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8">| SIH26167 &#8226; Space Applications Centre, ISRO</text>

  <!-- Right Header Badges -->
  <rect x="760" y="18" width="100" height="24" rx="12" fill="rgba(0,212,170,0.15)" stroke="#00D4AA" stroke-width="1"/>
  <text x="810" y="34" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#00D4AA" text-anchor="middle">ONLINE</text>

  <rect x="870" y="18" width="100" height="24" rx="12" fill="rgba(255,107,0,0.15)" stroke="#FF6B00" stroke-width="1"/>
  <text x="920" y="34" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#FF6B00" text-anchor="middle">DEMO MODE</text>

  <!-- LEFT PANEL: UPLOAD & QUERY (Width: 460) -->
  <rect x="30" y="85" width="450" height="535" rx="10" fill="#111F36" stroke="#1E3A5F" stroke-width="1.5"/>

  <text x="50" y="115" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#FF6B00">IMAGE INGESTION &amp; SENSOR CONFIG</text>

  <!-- Dropzone 1 -->
  <rect x="50" y="130" width="410" height="90" rx="8" fill="#091322" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="255" y="170" font-family="'Inter', sans-serif" font-size="12" fill="#CBD5E1" text-anchor="middle">📁 Drag &amp; Drop Primary Satellite Image</text>
  <text x="255" y="190" font-family="'Inter', sans-serif" font-size="10" fill="#64748B" text-anchor="middle">GeoTIFF, PNG, JPEG &#8226; Up to 50MB</text>

  <!-- Sensor Badge & Compare Toggle -->
  <rect x="50" y="230" width="180" height="26" rx="13" fill="rgba(56,189,248,0.15)" stroke="#38BDF8" stroke-width="1"/>
  <text x="140" y="247" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#38BDF8" text-anchor="middle">ISRO Cartosat-2S &#8226; 2.1m</text>

  <rect x="250" y="230" width="210" height="26" rx="13" fill="#1E293B"/>
  <text x="355" y="247" font-family="'Inter', sans-serif" font-size="10.5" fill="#FFFFFF" text-anchor="middle">✔ Compare Two Images (Active)</text>

  <!-- Dropzone 2 -->
  <rect x="50" y="265" width="410" height="65" rx="8" fill="#091322" stroke="#00D4AA" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="255" y="303" font-family="'Inter', sans-serif" font-size="11" fill="#CBD5E1" text-anchor="middle">📁 T2 (Post-Event Image) Uploaded: flood_t2.tif</text>

  <!-- QUERY SECTION -->
  <text x="50" y="358" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#00D4AA">NATURAL LANGUAGE QUERY</text>
  <rect x="50" y="370" width="410" height="75" rx="8" fill="#091322" stroke="#334155" stroke-width="1"/>
  <text x="65" y="395" font-family="'Inter', sans-serif" font-size="12" fill="#FFFFFF">How much area has been flooded between these two dates?</text>

  <!-- Example chips -->
  <rect x="50" y="455" width="125" height="22" rx="11" fill="#1E293B"/>
  <text x="112" y="470" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Identify flood water</text>

  <rect x="185" y="455" width="120" height="22" rx="11" fill="#1E293B"/>
  <text x="245" y="470" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Crop health check</text>

  <rect x="315" y="455" width="145" height="22" rx="11" fill="#1E293B"/>
  <text x="387" y="470" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Count maritime ships</text>

  <!-- ANALYZE BUTTON -->
  <rect x="50" y="495" width="410" height="42" rx="8" fill="#FF6B00"/>
  <text x="255" y="521" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">🛰️ ANALYZE SATELLITE SCENE</text>

  <!-- Quick Scenarios -->
  <text x="50" y="565" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#94A3B8">BUILT-IN ISRO SCENARIOS:</text>
  <rect x="50" y="575" width="95" height="25" rx="4" fill="#1E293B"/>
  <text x="97" y="591" font-family="'Inter', sans-serif" font-size="9.5" fill="#38BDF8" text-anchor="middle">1. Kerala Flood</text>
  <rect x="155" y="575" width="95" height="25" rx="4" fill="#1E293B"/>
  <text x="202" y="591" font-family="'Inter', sans-serif" font-size="9.5" fill="#CBD5E1" text-anchor="middle">2. Assam Forest</text>
  <rect x="260" y="575" width="95" height="25" rx="4" fill="#1E293B"/>
  <text x="307" y="591" font-family="'Inter', sans-serif" font-size="9.5" fill="#CBD5E1" text-anchor="middle">3. Delhi Urban</text>
  <rect x="365" y="575" width="95" height="25" rx="4" fill="#1E293B"/>
  <text x="412" y="591" font-family="'Inter', sans-serif" font-size="9.5" fill="#CBD5E1" text-anchor="middle">4. Crop Vigor</text>

  <!-- RIGHT PANEL: RESULTS & MAP (Width: 460) -->
  <rect x="510" y="85" width="460" height="535" rx="10" fill="#111F36" stroke="#1E3A5F" stroke-width="1.5"/>

  <!-- Visual Overlay Area -->
  <rect x="530" y="105" width="420" height="190" rx="8" fill="#091322" stroke="#334155" stroke-width="1"/>
  <!-- Synthetic image graphic inside overlay -->
  <rect x="540" y="115" width="400" height="170" fill="#1E3A8A" opacity="0.4"/>
  <!-- Flood mask overlay polygons in red/cyan -->
  <polygon points="580,180 660,170 720,230 640,250 570,220" fill="#EF4444" fill-opacity="0.6" stroke="#EF4444" stroke-width="2"/>
  <polygon points="760,150 840,140 880,190 820,210 750,180" fill="#EF4444" fill-opacity="0.6" stroke="#EF4444" stroke-width="2"/>
  <text x="640" y="215" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Zone 1 (8.2 ha)</text>
  <text x="815" y="180" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Zone 2 (3.7 ha)</text>

  <!-- Metric Badges Row -->
  <rect x="530" y="308" width="130" height="55" rx="6" fill="#091322" stroke="#FF6B00" stroke-width="1"/>
  <text x="595" y="330" font-family="'Inter', sans-serif" font-size="16" font-weight="bold" fill="#FF6B00" text-anchor="middle">11.93 ha</text>
  <text x="595" y="348" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Inundated Area</text>

  <rect x="675" y="308" width="130" height="55" rx="6" fill="#091322" stroke="#00D4AA" stroke-width="1"/>
  <text x="740" y="330" font-family="'Inter', sans-serif" font-size="16" font-weight="bold" fill="#00D4AA" text-anchor="middle">97% HIGH</text>
  <text x="740" y="348" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Bimodal Confidence</text>

  <rect x="820" y="308" width="130" height="55" rx="6" fill="#091322" stroke="#38BDF8" stroke-width="1"/>
  <text x="885" y="330" font-family="'Inter', sans-serif" font-size="16" font-weight="bold" fill="#38BDF8" text-anchor="middle">NDWI 0.72</text>
  <text x="885" y="348" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8" text-anchor="middle">Water Index Mean</text>

  <!-- Natural Language Answer Card -->
  <rect x="530" y="375" width="420" height="95" rx="8" fill="#091322" stroke="#00D4AA" stroke-width="1"/>
  <text x="545" y="398" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#00D4AA">SatQuery Analysis:</text>
  <text x="545" y="418" font-family="'Inter', sans-serif" font-size="10.5" fill="#E2E8F0">Between Oct 10 and Oct 12, 2023, substantial surface water expansion</text>
  <text x="545" y="434" font-family="'Inter', sans-serif" font-size="10.5" fill="#E2E8F0">was detected over Periyar basin, covering 11.93 ha across 2 sectors.</text>
  <text x="545" y="450" font-family="'Inter', sans-serif" font-size="10.5" fill="#38BDF8">Recommended action: Dispatch NDRF rescue boats to south-west zone.</text>

  <!-- Download Action Buttons & Trace Toggle -->
  <rect x="530" y="482" width="200" height="34" rx="6" fill="rgba(0,212,170,0.15)" stroke="#00D4AA" stroke-width="1"/>
  <text x="630" y="504" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#00D4AA" text-anchor="middle">⬇ Download Bhuvan GeoJSON</text>

  <rect x="750" y="482" width="200" height="34" rx="6" fill="rgba(255,107,0,0.15)" stroke="#FF6B00" stroke-width="1"/>
  <text x="850" y="504" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#FF6B00" text-anchor="middle">📄 Export Disaster PDF</text>

  <!-- Trace Panel Preview -->
  <rect x="530" y="528" width="420" height="75" rx="6" fill="#091322"/>
  <text x="545" y="548" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#94A3B8">▼ 12-Stage Scientific Trace (Click to Collapse):</text>
  <text x="545" y="567" font-family="'Inter', sans-serif" font-size="9.5" fill="#64748B">Stage 06: STSF-Net pseudo-change filter removed 9,262 false-alarm pixels</text>
  <text x="545" y="584" font-family="'Inter', sans-serif" font-size="9.5" fill="#64748B">Stage 11: Bimodal histogram separation ratio: 0.967 (HIGH Confidence)</text>
</svg>
