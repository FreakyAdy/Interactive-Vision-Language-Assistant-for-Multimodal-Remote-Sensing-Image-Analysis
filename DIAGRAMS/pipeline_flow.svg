<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 980" width="650" height="980">
  <defs>
    <linearGradient id="bgP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1628"/>
      <stop offset="100%" stop-color="#040810"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="650" height="980" fill="url(#bgP)"/>

  <!-- Title -->
  <text x="325" y="40" font-family="'Inter', sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">12-Stage Change Detection Pipeline</text>
  <text x="325" y="62" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">SatQuery AI &#8226; ISRO Bi-Temporal Processing Engine</text>

  <!-- STAGE 0 -->
  <g transform="translate(75, 85)">
    <rect width="500" height="52" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="36" height="52" rx="8" fill="#38BDF8"/>
    <text x="18" y="32" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#0B1628" text-anchor="middle">01</text>
    <text x="50" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Stage 0: Input Validation &amp; Spatial Crop</text>
    <text x="50" y="42" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">CRS validation, dimension match, non-zero pixel check (~1.2 ms)</text>
  </g>
  <line x1="325" y1="137" x2="325" y2="152" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- STAGE 1 -->
  <g transform="translate(75, 155)">
    <rect width="500" height="52" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="36" height="52" rx="8" fill="#38BDF8"/>
    <text x="18" y="32" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#0B1628" text-anchor="middle">02</text>
    <text x="50" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Stage 1: Sub-Pixel Co-registration</text>
    <text x="50" y="42" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Cross-correlation phase shift alignment between T1 and T2 (~3.5 ms)</text>
  </g>
  <line x1="325" y1="207" x2="325" y2="222" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- STAGE 2 -->
  <g transform="translate(75, 225)">
    <rect width="500" height="52" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="36" height="52" rx="8" fill="#38BDF8"/>
    <text x="18" y="32" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#0B1628" text-anchor="middle">03</text>
    <text x="50" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Stage 2: Relative Atmospheric Normalisation</text>
    <text x="50" y="42" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">CDF-based histogram matching suppresses atmospheric illumination shifts (~6.8 ms)</text>
  </g>
  <line x1="325" y1="277" x2="325" y2="292" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- STAGE 3 -->
  <g transform="translate(75, 295)">
    <rect width="500" height="52" rx="8" fill="#1E293B" stroke="#FF6B00" stroke-width="1.5"/>
    <rect width="36" height="52" rx="8" fill="#FF6B00"/>
    <text x="18" y="32" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">04</text>
    <text x="50" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Stage 3: Spectral Index Auto-Selection</text>
    <text x="50" y="42" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">ReAct keyword ontology selects NDWI, NDVI, NDBI, or RVI (~1.1 ms)</text>
  </g>
  <line x1="325" y1="347" x2="325" y2="362" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- STAGE 4 -->
  <g transform="translate(75, 365)">
    <rect width="500" height="52" rx="8" fill="#1E293B" stroke="#FF6B00" stroke-width="1.5"/>
    <rect width="36" height="52" rx="8" fill="#FF6B00"/>
    <text x="18" y="32" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">05</text>
    <text x="50" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Stage 4: Spectral Index Computation</text>
    <text x="50" y="42" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Computes per-pixel index for T1 and T2 using ISRO band mappings (~14.2 ms)</text>
  </g>
  <line x1="325" y1="417" x2="325" y2="432" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- STAGE 5 -->
  <g transform="translate(75, 435)">
    <rect width="500" height="52" rx="8" fill="#1E293B" stroke="#FF6B00" stroke-width="1.5"/>
    <rect width="36" height="52" rx="8" fill="#FF6B00"/>
    <text x="18" y="32" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">06</text>
    <text x="50" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Stage 5: Signed &amp; Absolute Difference Maps</text>
    <text x="50" y="42" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Δ_signed = T2 - T1 &#8226; Δ_abs = |T2 - T1| preserves change direction (~2.4 ms)</text>
  </g>
  <line x1="325" y1="487" x2="325" y2="502" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- STAGE 6: STSF-NET SUPPRESSION (CRITICAL) -->
  <g transform="translate(75, 505)">
    <rect width="500" height="56" rx="8" fill="#2A1B12" stroke="#FF6B00" stroke-width="2.5"/>
    <rect width="36" height="56" rx="8" fill="#FF6B00"/>
    <text x="18" y="34" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">07</text>
    <text x="50" y="25" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#FF6B00">Stage 6: STSF-Net Pseudo-Change Suppression</text>
    <text x="50" y="44" font-family="'Inter', sans-serif" font-size="11" fill="#FFFFFF">Compares patch variance σ_T1, σ_T2 vs μ_Δ; removes ~38% false alarms (~22.5 ms)</text>
  </g>
  <line x1="325" y1="561" x2="325" y2="576" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- STAGE 7 -->
  <g transform="translate(75, 579)">
    <rect width="500" height="52" rx="8" fill="#1E293B" stroke="#FF6B00" stroke-width="1.5"/>
    <rect width="36" height="52" rx="8" fill="#FF6B00"/>
    <text x="18" y="32" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">08</text>
    <text x="50" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Stage 7: Gaussian Spatial Smoothing</text>
    <text x="50" y="42" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Filters high-frequency salt-and-pepper sensor noise (σ = 1.5) (~4.6 ms)</text>
  </g>
  <line x1="325" y1="631" x2="325" y2="646" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- STAGE 8 -->
  <g transform="translate(75, 649)">
    <rect width="500" height="52" rx="8" fill="#1E293B" stroke="#FF6B00" stroke-width="1.5"/>
    <rect width="36" height="52" rx="8" fill="#FF6B00"/>
    <text x="18" y="32" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">09</text>
    <text x="50" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Stage 8: Automated Otsu Thresholding</text>
    <text x="50" y="42" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Maximises inter-class variance σ_B² to separate changed pixels (~3.1 ms)</text>
  </g>
  <line x1="325" y1="701" x2="325" y2="716" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- STAGE 9 -->
  <g transform="translate(75, 719)">
    <rect width="500" height="52" rx="8" fill="#1E293B" stroke="#00D4AA" stroke-width="1.5"/>
    <rect width="36" height="52" rx="8" fill="#00D4AA"/>
    <text x="18" y="32" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#0B1628" text-anchor="middle">10</text>
    <text x="50" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Stage 9: Morphological Opening &amp; Closing</text>
    <text x="50" y="42" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Disk structuring element eliminates isolated pixels &amp; fills interior voids (~5.8 ms)</text>
  </g>
  <line x1="325" y1="771" x2="325" y2="786" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- STAGE 10 -->
  <g transform="translate(75, 789)">
    <rect width="500" height="52" rx="8" fill="#1E293B" stroke="#00D4AA" stroke-width="1.5"/>
    <rect width="36" height="52" rx="8" fill="#00D4AA"/>
    <text x="18" y="32" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#0B1628" text-anchor="middle">11</text>
    <text x="50" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Stage 10: Connected Component Region Analysis</text>
    <text x="50" y="42" font-family="'Inter', sans-serif" font-size="11" fill="#94A3B8">Counts distinct clusters &amp; computes physical area in m², ha, and km² (~4.9 ms)</text>
  </g>
  <line x1="325" y1="841" x2="325" y2="856" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- STAGE 11 -->
  <g transform="translate(75, 859)">
    <rect width="500" height="56" rx="8" fill="#0F2820" stroke="#00D4AA" stroke-width="2"/>
    <rect width="36" height="56" rx="8" fill="#00D4AA"/>
    <text x="18" y="34" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#0B1628" text-anchor="middle">12</text>
    <text x="50" y="25" font-family="'Inter', sans-serif" font-size="13" font-weight="bold" fill="#00D4AA">Stage 11: Bimodal Histogram Confidence Scoring</text>
    <text x="50" y="44" font-family="'Inter', sans-serif" font-size="11" fill="#FFFFFF">Computes physical confidence: C = ω &#8226; v &#8226; p ➔ HIGH/MEDIUM/LOW (~2.8 ms)</text>
  </g>

  <!-- Output Footer -->
  <text x="325" y="950" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#00D4AA" text-anchor="middle">➔ Emits Verified GeoJSON Vector Layer + Structured Disaster Report</text>
</svg>
